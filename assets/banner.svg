<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16203a" stroke-width="1" opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#00f2fe" opacity="0.3"/>
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .radar-sweep {
      transform-origin: 1060px 100px;
      animation: radarSweep 10s linear infinite;
    }
    .pulsing-orb {
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .float-item-1 {
      animation: floatPill1 4s ease-in-out infinite;
    }
    .float-item-2 {
      animation: floatPill2 4.5s ease-in-out infinite;
    }
    .circuit-packet {
      stroke-dasharray: 60 340;
      animation: flowLine 5s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="150" cy="180" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glow)" class="pulsing-orb"/>
  <circle cx="1050" cy="100" r="180" fill="#7928ca" opacity="0.15" filter="url(#glow)" class="pulsing-orb"/>
  <circle cx="600" cy="300" r="160" fill="#4facfe" opacity="0.08" filter="url(#glow)"/>

  <!-- Animated Circuit Tracks & Data Packets in Background -->
  <g opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M 50 80 H 300 L 360 140 H 500" stroke="#1e3a5f"/>
    <path d="M 50 80 H 300 L 360 140 H 500" stroke="#00f2fe" stroke-width="2" class="circuit-packet"/>

    <path d="M 700 280 H 880 L 940 220 H 1150" stroke="#3b1d60"/>
    <path d="M 700 280 H 880 L 940 220 H 1150" stroke="#ff0080" stroke-width="2" class="circuit-packet" style="animation-duration: 6s;"/>

    <path d="M 80 300 H 260 L 320 250 H 450" stroke="#1e3a5f"/>
    <path d="M 80 300 H 260 L 320 250 H 450" stroke="#4facfe" stroke-width="2" class="circuit-packet" style="animation-duration: 7s;"/>
  </g>

  <!-- Radar / Fleet Scanner in Top Right (Background) -->
  <g opacity="0.35">
    <circle cx="1060" cy="100" r="30" fill="none" stroke="#00f2fe" stroke-width="1"/>
    <circle cx="1060" cy="100" r="60" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="1060" cy="100" r="90" fill="none" stroke="#00f2fe" stroke-width="1"/>
    <line x1="1060" y1="10" x2="1060" y2="190" stroke="#00f2fe" stroke-width="0.7" opacity="0.5"/>
    <line x1="970" y1="100" x2="1150" y2="100" stroke="#00f2fe" stroke-width="0.7" opacity="0.5"/>
    <line x1="1060" y1="100" x2="1130" y2="40" stroke="#00f2fe" stroke-width="2" class="radar-sweep" opacity="0.8"/>
    <!-- Radar blips -->
    <circle cx="1090" cy="70" r="3" fill="#00f2fe">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1025" cy="120" r="2.5" fill="#4facfe">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1115" cy="135" r="3" fill="#00dfd8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating Dynamic Tech Badges -->
  <g class="float-item-1">
    <rect x="940" y="240" width="180" height="34" rx="17" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" opacity="0.85"/>
    <circle cx="958" cy="257" r="4" fill="#00f2fe"/>
    <text x="972" y="261" fill="#38bdf8" class="pill-label">🛰️ FLEET ORCHESTRATION</text>
  </g>

  <g class="float-item-2">
    <rect x="980" y="290" width="145" height="34" rx="17" fill="#0f172a" stroke="#7928ca" stroke-width="1.2" opacity="0.85"/>
    <circle cx="998" cy="307" r="4" fill="#a855f7"/>
    <text x="1012" y="311" fill="#c084fc" class="pill-label">⚡ ROBOPS / EDGE</text>
  </g>

  <!-- FOREGROUND CONTENT: Clean typography with high contrast -->
  <g transform="translate(80, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="18" fill="#e2e8f0" class="pill-label" font-size="11">🚀 CURATED ROBOPS &amp; DEPLOYMENT</text>
    </g>

    <!-- Main Title with Gradient Line -->
    <text x="0" y="132" class="title-text" font-size="44" letter-spacing="-0.5px">Awesome Robotics Deployment</text>
    <rect x="0" y="146" width="580" height="4" rx="2" fill="url(#cyan-blue)"/>

    <!-- Subtitle -->
    <text x="0" y="184" class="subtitle-text" font-size="20">Ecosystem of SaaS Platforms, Fleet Orchestrators &amp; Edge RobOps</text>
    <text x="0" y="212" class="subtitle-text" font-size="14" fill="#64748b">Production-grade infrastructure for Autonomous Mobile Robots (AMRs), Drones &amp; Edge Hardware</text>

    <!-- Bottom Feature Tag Pills -->
    <g transform="translate(0, 248)">
      <!-- Pill 1 -->
      <g>
        <rect width="135" height="32" rx="16" fill="#111c35" stroke="#1d4ed8" stroke-width="1"/>
        <text x="14" y="20" fill="#93c5fd" class="pill-label">🌐 Multi-Fleet RMF</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="135" height="32" rx="16" fill="#111c35" stroke="#0284c7" stroke-width="1"/>
        <text x="14" y="20" fill="#7dd3fc" class="pill-label">📡 ROS 2 &amp; Micro-ROS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(290, 0)">
        <rect width="135" height="32" rx="16" fill="#111c35" stroke="#7c3aed" stroke-width="1"/>
        <text x="14" y="20" fill="#c4b5fd" class="pill-label">📊 Observability Stack</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(435, 0)">
        <rect width="135" height="32" rx="16" fill="#111c35" stroke="#059669" stroke-width="1"/>
        <text x="14" y="20" fill="#6ee7b7" class="pill-label">🔄 OTA &amp; Edge Runtime</text>
      </g>
    </g>
  </g>
</svg>
